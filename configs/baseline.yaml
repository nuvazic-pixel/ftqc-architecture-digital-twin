experiment:
  name: baseline_transmon_v01
  version: "0.1"
  seed: 42

workload:
  logical_qubits: 100
  t_count: 10000000
  t_depth: 1500000
  clifford_count: 50000000
  circuit_depth: 5000000

hardware:
  platform: superconducting_transmon

  topology:
    type: grid_2d
    routing_model: scalar
    zeta: 3.0

  errors:
    p_1q:
      value: 1.0e-4
      source: benchmark_assumption

    p_2q:
      value: 1.0e-3
      source: benchmark_assumption

    p_measurement:
      value: 1.0e-3
      source: benchmark_assumption

  timing_ns:
    gate_1q: 25
    gate_2q: 100
    measurement: 500

qec:
  code: surface_code

  target_logical_error: 1.0e-12

  physical_error_threshold:
    value: 1.0e-2
    source: model_assumption

  fit_A:
    value: 0.1
    source: model_assumption

  allowed_distances:
    - 13
    - 15
    - 17
    - 19
    - 21
    - 23
    - 25
    - 27

factories:
  type: magic_state_T

  throughput_data:
    - d: 17
      states_per_second: 80.95
      source: model_derived

    - d: 18
      states_per_second: 75.50
      source: model_derived

    - d: 21
      states_per_second: 60.47
      source: model_derived

  min_factories: 1
  max_factories: 250

resource_model:
  scope: whole_machine_partial

  tile_model:
    physical_qubits_per_d2:
      value: 2.0
      source: literature_model
      reference: "surface-code tile approximation (~2 d^2 physical qubits per tile)"

  data_block:
    physical_qubits_per_d2:
      value: 2.0
      source: model_assumption
    scope: logical_patch_lower_bound

  factory:
    protocol:
      name: litinski_116_to_12_compact
      source: literature
      reference: "Daniel Litinski, A Game of Surface Codes, Quantum 3, 128 (2019)"
      physical_error_reference: 1.0e-3
      distillation_tiles: 44
      output_storage_tiles: 13
      output_states_per_batch: 12
      protocol_steps_per_batch: 99
      reported_success_probability: 0.89

    throughput_binding:
      status: unverified
      note: >
        The existing r_T(d) regression data are model-derived fixtures and are
        not yet derived from the Litinski 116-to-12 timing model. Footprint and
        runtime must therefore be treated as a mixed-model result until a
        protocol-consistent throughput model is implemented.

  routing:
    model: unmodeled

  workspace:
    model: unmodeled

optimizer:
  method: discrete_search
  objective: space_time_volume

  constraints:
    max_failure_probability: 0.01
    max_runtime_seconds: 3600

  pareto_metrics:
    - physical_qubits
    - runtime_seconds

outputs:
  save_runs_csv: true
  save_pareto_csv: true
  save_config_snapshot: true
  save_figures: true
