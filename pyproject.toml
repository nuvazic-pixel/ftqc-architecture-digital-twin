[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ftqc-architecture-digital-twin"
version = "0.1.0"
description = "Reproducible FTQC architecture digital-twin simulator"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "numpy>=2.0,<3",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
packages = ["simulator", "metrics", "experiments", "qad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
